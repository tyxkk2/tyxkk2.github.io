baseURL = 'https://tyxkk2.me'
locale = 'zh-cn'
title = 'Yuxuan Tang'
theme = 'PaperMod'

[taxonomies]
  tag = 'tags'
  category = 'categories'

[pagination]
  pagerSize = 10

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    noClasses = false

  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['$$', '$$'], ['\\[', '\\]']]
          inline = [['$', '$'], ['\\(', '\\)']]

[params]
  defaultTheme = "auto"
  defaultPostDecorImage = "images/bg.jpg"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true

[params.profileMode]
  enabled = true
  title = "Yuxuan Tang"
  subtitle = "CS @ Tsinghua · LLM Systems · Long-Video Understanding"
  imageUrl = "images/avatar.jpg"
  imageTitle = "avatar"

[params.homePoem]
  lines = [
    "それが虚無ならば虚無自身がこのとほりで",
    "ある程度まではみんなに共通いたします",
    "すべてがわたくしの中のみんなであるやうに",
    "　みんなのおのおののなかのすべてですから"
  ]
  source = "宮沢賢治『春と修羅』"

